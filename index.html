<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nunu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --gold:#fea322; --deep:#0e1360; --mid:#1c2694; --bright:#2f3dd0; --edge:#a8b5e6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#05060f;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  body { font-family:'Press Start 2P', monospace; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }

  /* Ladebildschirm */
  #boot {
    position:fixed; inset:0; background:#05060f; color:var(--edge);
    display:grid; place-content:center; gap:22px; justify-items:center;
    text-align:center; padding:24px; z-index:40; transition:opacity .5s;
  }
  #boot h1 { font-size:13px; color:var(--gold); letter-spacing:1px; line-height:2; }
  #bar { width:min(58vw,420px); height:14px; border:3px solid var(--edge); background:#0a0d2e; }
  #bar i { display:block; height:100%; width:0; background:var(--gold); transition:width .2s; }
  #boot small { font-size:8px; opacity:.6; line-height:1.9; }
  #startbtn {
    font-family:inherit; font-size:11px; color:#05060f; background:var(--gold);
    border:0; padding:16px 26px; cursor:pointer; display:none; letter-spacing:1px;
  }

  /* Star-Wars-Crawl */
  #crawlwrap {
    position:fixed; inset:0; z-index:20; display:none;
    perspective:760px; perspective-origin:50% 92%; overflow:hidden;
    background:transparent; pointer-events:none;
  }
  #crawl {
    position:absolute; left:50%; bottom:0; width:min(78vw, 1000px);
    transform-origin:50% 100%; transform:translateX(-50%) rotateX(36deg);
    color:var(--gold); text-align:justify; font-size:clamp(13px,2.1vw,26px);
    line-height:2.3; text-shadow:0 0 22px rgba(254,163,34,.4);
  }
  #crawl h2 { text-align:center; font-size:1.5em; line-height:2; margin-bottom:1.6em; }
  #crawl p { margin-bottom:1.6em; }

  /* Buttons */
  #mute {
    position:fixed; top:max(14px, env(safe-area-inset-top)); left:max(16px, env(safe-area-inset-left)); z-index:30;
    width:52px; height:52px; border:3px solid var(--edge); background:rgba(10,13,46,.72);
    color:var(--gold); font-family:inherit; font-size:15px; display:none;
    align-items:center; justify-content:center; cursor:pointer;
  }
  #again {
    position:fixed; left:50%; bottom:9%; transform:translateX(-50%); z-index:30;
    font-family:inherit; font-size:11px; color:#05060f; background:var(--gold);
    border:0; padding:15px 24px; display:none; cursor:pointer; letter-spacing:1px;
  }
  #dbg {
    position:fixed; inset:0; z-index:35; background:rgba(5,6,15,.93); display:none;
    place-content:center; gap:10px; padding:26px;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  }
  #dbg button {
    font-family:inherit; font-size:9px; padding:14px 8px; color:var(--edge);
    background:#0e1360; border:2px solid var(--bright); cursor:pointer;
  }
  #hotcorner { position:fixed; left:0; bottom:0; width:64px; height:64px; z-index:31; }

  /* iPad hochkant: bitte drehen */
  #drehen {
    position:fixed; inset:0; z-index:60; background:#05060f; color:var(--gold);
    display:none; place-content:center; justify-items:center; gap:20px;
    text-align:center; padding:30px; font-size:11px; line-height:2.2;
  }
  #drehen svg { width:64px; height:64px; }
  @media (orientation:portrait) { #drehen { display:grid; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="crawlwrap"><div id="crawl"></div></div>

<button id="mute" aria-label="Ton an/aus">♪</button>
<button id="again">Nochmal</button>
<div id="hotcorner"></div>
<div id="dbg"></div>

<div id="drehen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
    <rect x="3" y="7" width="18" height="11" rx="1.5"/>
    <path d="M8 3.5 A9 9 0 0 1 16 3.5"/><path d="M16 3.5 l-2.4 -1.4 M16 3.5 l-1.4 2.4"/>
  </svg>
  Bitte das iPad quer halten
</div>

<div id="boot">
  <h1>Für Nunu</h1>
  <div id="bar"><i></i></div>
  <small id="bootmsg">Lädt …</small>
  <button id="startbtn">Start</button>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
