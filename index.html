<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown zum 24.</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: #000;
        color: #e6e6e6;
        font-family:
          ui-monospace, "JetBrains Mono", "Fira Code", Consolas, "Courier New",
          monospace;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .stage {
        width: 100%;
        max-width: 720px;
        text-align: center;
      }

      .timer {
        display: block;
        font-size: clamp(2.2rem, 9vw, 5.2rem);
        font-weight: 700;
        line-height: 1;
        color: #d8d8d8;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 24px rgba(255, 255, 255, 0.06);
        margin-bottom: 36px;
      }

      .timer .blink {
        animation: blink 1s steps(2, end) infinite;
        color: #fff;
      }

      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }

      .sep {
        display: inline-block;
        margin: 0 0.1em;
        color: #3a3a3a;
      }

      .life-timer {
        font-size: clamp(1.1rem, 3vw, 1.5rem);
        color: #6a6a6a;
        text-shadow: none;
        margin-bottom: 0;
      }

      .life-timer b {
        color: #999;
        font-weight: 700;
        margin: 0 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .blink {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="timer" id="timer" aria-live="polite">
        <span id="days">0</span><span class="sep">:</span
        ><span id="hours">00</span><span class="sep">:</span
        ><span id="mins">00</span><span class="sep" id="sep2">:</span
        ><span id="secs">00</span>
      </div>

      <div class="timer life-timer" id="life" aria-live="off">—</div>
    </div>

    <script>
      (() => {
        "use strict";

        const birth = new Date(2002, 7, 17, 1, 25, 0, 0); // Monat 7 = August
        const birthMs = birth.getTime();

        function nextBirthday(now) {
          const y = now.getFullYear();
          let target = new Date(y, 7, 17, 1, 25, 0, 0);
          if (target.getTime() <= now.getTime()) {
            target = new Date(y + 1, 7, 17, 1, 25, 0, 0);
          }
          return target;
        }

        function ymdDiff(from, to) {
          let y = to.getFullYear() - from.getFullYear();
          let m = to.getMonth() - from.getMonth();
          let d = to.getDate() - from.getDate();
          if (d < 0) {
            const prev = new Date(to.getFullYear(), to.getMonth(), 0);
            d += prev.getDate();
            m -= 1;
          }
          if (m < 0) {
            m += 12;
            y -= 1;
          }
          return { y, m, d };
        }

        const pad = (n) => String(Math.max(0, n)).padStart(2, "0");

        const $days = document.getElementById("days");
        const $hours = document.getElementById("hours");
        const $mins = document.getElementById("mins");
        const $secs = document.getElementById("secs");
        const $sep2 = document.getElementById("sep2");
        const $life = document.getElementById("life");

        function tick() {
          const now = new Date();
          const nowMs = now.getTime();

          // Countdown
          const target = nextBirthday(now);
          const diffMs = target.getTime() - nowMs;

          if (diffMs <= 0) {
            $days.textContent = "0";
            $hours.textContent = "00";
            $mins.textContent = "00";
            $secs.textContent = "00";
            $sep2.classList.remove("blink");
          } else {
            const totalSec = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSec / 86400);
            const hours = Math.floor((totalSec % 86400) / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;
            $days.textContent = days;
            $hours.textContent = pad(hours);
            $mins.textContent = pad(mins);
            $secs.textContent = pad(secs);
          }

          // Lebenszeit (exakt, lokale Zeitzone)
          const { y, m, d } = ymdDiff(birth, now);
          const lifeSec = Math.floor((nowMs - birthMs) / 1000);
          const lHours = Math.floor((lifeSec % 86400) / 3600);
          const lMins = Math.floor((lifeSec % 3600) / 60);
          const lSecs = lifeSec % 60;
          $life.innerHTML =
            `<b>${y}</b> Jahre · <b>${m}</b> Monate · <b>${d}</b> Tage · ` +
            `<b>${pad(lHours)}</b>:<b>${pad(lMins)}</b>:<b>${pad(lSecs)}</b>`;
        }

        tick();
        (function schedule() {
          const delay = 1000 - (Date.now() % 1000);
          setTimeout(() => {
            tick();
            schedule();
          }, delay);
        })();
      })();
    </script>
  </body>
</html>
