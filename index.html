<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Countdown zum 24.</title>
<style>
  :root {
    --bg-1: #0b1026;
    --bg-2: #1a0f3d;
    --bg-3: #3a1f6b;
    --ink: #f3f0ff;
    --ink-dim: #b9b3d8;
    --glass: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.14);
    --c-days: #ff7ab6;
    --c-hours: #a07bff;
    --c-min: #7afcff;
    --c-sec: #ffd07a;
    --c-life: #7fffd4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #07091a;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(122, 90, 255, 0.18), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255, 122, 182, 0.12), transparent 55%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    position: relative;
  }

  /* ============ STERNENHIMMEL ============ */
  .stars,
  .twinkles,
  .shoots {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .stars { z-index: 0; }
  .twinkles { z-index: 1; }
  .shoots { z-index: 2; }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.85;
  }

  .twinkle {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur, 4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1.2); }
  }

  .shooting-star {
    position: absolute;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0));
    opacity: 0;
    transform: rotate(-15deg);
    animation: shoot 9s linear infinite;
    animation-delay: var(--delay, 0s);
    top: var(--top, 10%);
    left: var(--left, -10%);
  }

  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-15deg); }
    3%   { opacity: 1; }
    20%  { opacity: 0; transform: translate(110vw, 60vh) rotate(-15deg); }
    100% { opacity: 0; transform: translate(110vw, 60vh) rotate(-15deg); }
  }

  /* ============ LAYOUT ============ */
  .wrap {
    position: relative;
    z-index: 10;
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(28px, 6vw, 64px) clamp(16px, 4vw, 40px) 80px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* ============ HERO ============ */
  .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 18px 0 6px;
    opacity: 0;
    animation: rise 1s 0.1s ease-out forwards;
  }

  h1 {
    font-size: clamp(1.9rem, 5vw, 3.2rem);
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 0%, #ffd6f0 40%, #c7b6ff 70%, #b6f0ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    animation: rise 1s 0.25s ease-out forwards;
  }

  .sub {
    font-size: clamp(0.92rem, 1.6vw, 1.05rem);
    color: var(--ink-dim);
    margin: 0 0 36px;
    opacity: 0;
    animation: rise 1s 0.4s ease-out forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ COUNTDOWN ============ */
  .label-row {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 8px 0 14px;
    opacity: 0;
    animation: rise 1s 0.55s ease-out forwards;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(10px, 1.8vw, 18px);
    width: 100%;
    max-width: 820px;
    margin-bottom: 48px;
    opacity: 0;
    animation: rise 1s 0.7s ease-out forwards;
  }

  .card {
    position: relative;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: clamp(18px, 3vw, 28px) 8px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, var(--glow, #fff), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0.6;
    pointer-events: none;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: -40% -40% auto auto;
    width: 180px;
    height: 180px;
    background: var(--glow, #fff);
    filter: blur(60px);
    opacity: 0.22;
    pointer-events: none;
  }

  .card.days   { --glow: var(--c-days); }
  .card.hours  { --glow: var(--c-hours); }
  .card.mins   { --glow: var(--c-min); }
  .card.secs   { --glow: var(--c-sec); }

  .num {
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: clamp(2rem, 6vw, 3.6rem);
    font-weight: 700;
    line-height: 1;
    color: var(--glow, #fff);
    text-shadow: 0 0 30px color-mix(in srgb, var(--glow, #fff) 50%, transparent);
    font-variant-numeric: tabular-nums;
    display: block;
  }

  .unit {
    display: block;
    margin-top: 10px;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .card.secs .num.pulse {
    animation: pulse 0.4s ease-out;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ============ LEBENSZEIT ============ */
  .life-label {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 4px 0 14px;
    opacity: 0;
    animation: rise 1s 0.95s ease-out forwards;
  }

  .life {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: clamp(8px, 1.4vw, 14px);
    width: 100%;
    max-width: 720px;
    opacity: 0;
    animation: rise 1s 1.1s ease-out forwards;
  }

  .life-card {
    background: rgba(127, 255, 212, 0.04);
    border: 1px solid rgba(127, 255, 212, 0.18);
    border-radius: 14px;
    padding: clamp(14px, 2.4vw, 20px) 6px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .life-card .num {
    color: var(--c-life);
    font-size: clamp(1.4rem, 3.6vw, 2.1rem);
    text-shadow: 0 0 24px rgba(127, 255, 212, 0.45);
  }

  .life-card .unit { margin-top: 6px; font-size: 0.62rem; }

  /* ============ FOOTER ============ */
  footer {
    margin-top: auto;
    padding-top: 40px;
    color: var(--ink-dim);
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    opacity: 0;
    animation: rise 1s 1.3s ease-out forwards;
  }

  footer .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--c-life);
    box-shadow: 0 0 10px var(--c-life);
    vertical-align: middle;
    margin-right: 8px;
    animation: blink 2.4s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.35; }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 560px) {
    .countdown { grid-template-columns: repeat(2, 1fr); }
    .life      { grid-template-columns: repeat(2, 1fr); }
    .life .life-card:nth-child(5) {
      grid-column: span 2;
      max-width: 50%;
      justify-self: center;
    }
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
  }
</style>
</head>
<body>

<div class="stars"   id="stars"></div>
<div class="twinkles" id="twinkles"></div>
<div class="shoots"  id="shoots"></div>

<main class="wrap">

  <p class="eyebrow">Live · Echtzeit</p>
  <h1>Countdown zum 24.</h1>
  <p class="sub">Geb. 17. August 2002 · 01:25 Uhr</p>

  <p class="label-row">Noch bis zum nächsten Geburtstag</p>

  <section class="countdown" aria-label="Countdown">
    <div class="card days"><span class="num" id="cd-days">0</span><span class="unit">Tage</span></div>
    <div class="card hours"><span class="num" id="cd-hours">00</span><span class="unit">Stunden</span></div>
    <div class="card mins"><span class="num" id="cd-mins">00</span><span class="unit">Minuten</span></div>
    <div class="card secs"><span class="num" id="cd-secs">00</span><span class="unit">Sekunden</span></div>
  </section>

  <p class="life-label">Bisher gelebt</p>

  <section class="life" aria-label="Lebenszeit">
    <div class="life-card"><span class="num" id="ly-years">0</span><span class="unit">Jahre</span></div>
    <div class="life-card"><span class="num" id="ly-days">0</span><span class="unit">Tage</span></div>
    <div class="life-card"><span class="num" id="ly-hours">00</span><span class="unit">Stunden</span></div>
    <div class="life-card"><span class="num" id="ly-mins">00</span><span class="unit">Minuten</span></div>
    <div class="life-card"><span class="num" id="ly-secs">00</span><span class="unit">Sekunden</span></div>
  </section>

  <footer><span class="dot"></span>seit 17.08.2002 · 01:25</footer>

</main>

<script>
(() => {
  "use strict";

  // ============ STERNENHIMMEL GENERIEREN ============
  const rand = (a, b) => Math.random() * (b - a) + a;

  const stars = document.getElementById("stars");
  const twinkles = document.getElementById("twinkles");
  const shoots = document.getElementById("shoots");

  // kleine, statische Sterne
  for (let i = 0; i < 110; i++) {
    const s = document.createElement("span");
    s.className = "star";
    const size = rand(0.6, 1.4);
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.top = rand(0, 100) + "%";
    s.style.left = rand(0, 100) + "%";
    s.style.opacity = rand(0.35, 0.85).toFixed(2);
    stars.appendChild(s);
  }

  // Twinkle-Sterne
  for (let i = 0; i < 35; i++) {
    const t = document.createElement("span");
    t.className = "twinkle";
    const size = rand(1.2, 2.4);
    t.style.width = size + "px";
    t.style.height = size + "px";
    t.style.top = rand(0, 100) + "%";
    t.style.left = rand(0, 100) + "%";
    t.style.setProperty("--dur", rand(3, 7).toFixed(2) + "s");
    t.style.setProperty("--delay", rand(0, 6).toFixed(2) + "s");
    twinkles.appendChild(t);
  }

  // Shooting-Sterne
  for (let i = 0; i < 3; i++) {
    const s = document.createElement("span");
    s.className = "shooting-star";
    s.style.setProperty("--delay", (i * 3 + rand(0, 4)).toFixed(2) + "s");
    s.style.setProperty("--top", rand(0, 60).toFixed(1) + "%");
    s.style.setProperty("--left", rand(-20, -5).toFixed(1) + "%");
    s.style.width = rand(80, 160) + "px";
    shoots.appendChild(s);
  }

  // ============ ZEIT-BERECHNUNG ============
  // Geburtszeit
  const birth = new Date(2002, 7, 17, 1, 25, 0, 0); // Monat 7 = August
  const birthMs = birth.getTime();

  // Nächster Geburtstag (initial: 17.08.2026 01:25)
  function nextBirthday(now) {
    const y = now.getFullYear();
    let target = new Date(y, 7, 17, 1, 25, 0, 0);
    if (target.getTime() <= now.getTime()) {
      target = new Date(y + 1, 7, 17, 1, 25, 0, 0);
    }
    return target;
  }

  // Differenz Jahre/Monate/Tage über UTC-Datum (korrekt für Schaltjahre/kürzere Monate)
  function ymdDiff(from, to) {
    let y = to.getUTCFullYear() - from.getUTCFullYear();
    let m = to.getUTCMonth() - from.getUTCMonth();
    let d = to.getUTCDate()  - from.getUTCDate();

    if (d < 0) {
      // Tage im Vormonat aus to
      const prevMonth = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), 0));
      d += prevMonth.getUTCDate();
      m -= 1;
    }
    if (m < 0) {
      m += 12;
      y -= 1;
    }
    return { y, m, d };
  }

  const pad = (n, w = 2) => String(Math.max(0, n)).padStart(w, "0");

  // DOM-Cache
  const el = {
    cdDays:  document.getElementById("cd-days"),
    cdHours: document.getElementById("cd-hours"),
    cdMins:  document.getElementById("cd-mins"),
    cdSecs:  document.getElementById("cd-secs"),
    lyYears: document.getElementById("ly-years"),
    lyDays:  document.getElementById("ly-days"),
    lyHours: document.getElementById("ly-hours"),
    lyMins:  document.getElementById("ly-mins"),
    lySecs:  document.getElementById("ly-secs"),
  };

  let lastSec = -1;

  function tick() {
    const now = new Date();
    const nowMs = now.getTime();

    // --- COUNTDOWN ---
    const target = nextBirthday(now);
    const diffMs = target.getTime() - nowMs;

    if (diffMs <= 0) {
      el.cdDays.textContent  = "0";
      el.cdHours.textContent = "00";
      el.cdMins.textContent  = "00";
      el.cdSecs.textContent  = "00";
    } else {
      const totalSec = Math.floor(diffMs / 1000);
      const days  = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins  = Math.floor((totalSec % 3600) / 60);
      const secs  = totalSec % 60;

      el.cdDays.textContent  = days;
      el.cdHours.textContent = pad(hours);
      el.cdMins.textContent  = pad(mins);
      el.cdSecs.textContent  = pad(secs);
    }

    // --- LEBENSZEIT ---
    const { y, m, d } = ymdDiff(birth, now);
    const lifeMs = nowMs - birthMs;
    const lifeSec = Math.floor(lifeMs / 1000);
    const lHours = Math.floor((lifeSec % 86400) / 3600);
    const lMins  = Math.floor((lifeSec % 3600) / 60);
    const lSecs  = lifeSec % 60;

    el.lyYears.textContent = y;
    el.lyDays.textContent  = m * 30 + d; // grobe Tage-Schätzung Monat ≈ 30d, Resttage addiert
    el.lyHours.textContent = pad(lHours);
    el.lyMins.textContent  = pad(lMins);
    el.lySecs.textContent  = pad(lSecs);

    // Puls nur beim Sekundenwechsel
    if (lSecs !== lastSec) {
      el.cdSecs.classList.remove("pulse");
      // Reflow, damit Animation neu startet
      void el.cdSecs.offsetWidth;
      el.cdSecs.classList.add("pulse");
      lastSec = lSecs;
    }
  }

  // Sofort rendern, dann drift-korrigierten Ticker
  tick();
  function schedule() {
    const now = Date.now();
    const delay = 1000 - (now % 1000);
    setTimeout(() => {
      tick();
      schedule();
    }, delay);
  }
  schedule();
})();
</script>

</body>
</html>
